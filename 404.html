<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Extincorp</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px;
      background: #f9f9f9;
    }
  </style>
  <script>
    // Redirige a index.html después de un breve retraso (mejor UX)
    setTimeout(function() {
      window.location.href = "/";
    }, 2000); // 2 segundos
  </script>
</head>
<body>
  <h1>404 - Página no encontrada</h1>
  <p>La página que buscas no existe.</p>
  <p>Redirigiendo a la página principal...</p>
  <p><a href="/">Ir a inicio</a></p>
</body>
</html>
